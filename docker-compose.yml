services:
  api:
    build: ./backend
    container_name: nubelectora-api
    ports:
      - "3000:3000"
    volumes:
      - ./backend/db.json:/app/db.json
    environment:
      - PORT=3000
      - JWT_SECRET=mi-codigo-secreto

  frontend:
    build: .
    container_name: nubelectora-frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:3000